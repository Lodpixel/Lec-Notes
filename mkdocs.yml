# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Lec Notes
site_description: 课程学习笔记与讲座转录
site_url: https://lodpixel.github.io/Lec-Notes/
repo_url: https://github.com/Lodpixel/Lec-Notes
repo_name: Lodpixel/Lec-Notes
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 课内:
      - 离散数学: 课内/离散数学/index.md
      - 概率统计: 课内/概率统计/index.md
      - ICS: 课内/ics/index.md
      - 大学物理: 课内/大学物理/index.md
  - 课外自学:
      - AI Infra:
          - 总览: 课外自学/ai-infra/index.md
          - 1.1 CUDA Programming Model: 课外自学/ai-infra/1-1-cuda-programming-model.md
          - 1.2 Triton/TileLang Tile Level Programming: 课外自学/ai-infra/1-2-triton-tilelang.md
          - 2.1 Memory Abstraction & Hierarchy: 课外自学/ai-infra/2-1-memory-abstraction.md
          - 2.2 FP32 GEMM Quick Walkthrough: 课外自学/ai-infra/2-2-fp32-gemm.md
          - W.1 Parallel Programming with TileLang: 课外自学/ai-infra/w-1-parallel-programming-tilelang.md
          - 3. Tensor Core：从 mma.sync 到 tcgen05: 课外自学/ai-infra/3-tensor-core.md
          - 4. Pipeline Ordering：Data Orchestration: 课外自学/ai-infra/4-pipeline-ordering.md
          - 5. Towards Modern Networking System: 课外自学/ai-infra/5-modern-networking-system.md

copyright: 内容版权归原讲者及原发布方所有；本站整理内容仅供学习交流。
